<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        body{
             
            background: linear-gradient(270deg, rgb(217, 15, 166), rgb(175, 141, 78),aqua,blue,black,rgb(74, 198, 36)); ;
            padding: 200px;
            margin: 50px auto;
        }
        button{
            border: 2px solid #bb09ad;;
            border-radius: 50px;
            box-shadow: -3px -8px -15px rgba(103, 12, 222, 0.9);
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            padding: 30px;
            margin: 60px auto;
            text-align: center;
            align-items: center;
            font-weight:900;
            background: linear-gradient(10deg,pink,rgb(117, 128, 117),yellow,aqua);
            cursor: pointer;
        }
        div{
            width: 50%;
            height:10vh;
            border-radius: 30px;
            background:linear-gradient(360deg,green,white,orange);
            color:black;
            padding: 10px;
            align-content: center;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: 900;
        }
        span{
            width: 100%;
            height: 30px;
            border-radius: 30px;
            background:linear-gradient(45deg,lightpink,rgb(28, 158, 201),rgb(212, 12, 12));
            padding: 30px;
            font-weight: bold;
        }
     </style>
</head>
<body>
       <button id="btn"> SANMALA GOVARDHAN </button>
        <div id="btn1"></div>
       <span id="output"></span>
        <button id="output1"></button>
        

       <script src="./script.js"></script>
</body>
</html>
